  <style>
    * {

    html, body {
      margin: 0;

      background: #0d0d0d;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;

    .page {

    /* Video Player Box */

    }

    video {
      width: 100%;
      max-height: 70vh;
      object-fit: contain;
      display: block;
      background: #000;
    }

    video::-webkit-media-controls-fullscreen-button,
    video::-webkit-media-controls-overflow-button {
      display: none !important;
    }

    /* Section & Container Titles */
    .rec-title {
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      padding: 16px 15px 8px;
      letter-spacing: 0.3px;
    }

    /* Ads Card Containers */
    .ads-card {
      margin: 12px 15px;
      padding: 10px;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      text-align: center;
    }

    .ads-label {
      font-size: 10px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .banner-box {
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .native-wrap {
      padding: 10px;

  <!-- PLAYER SCRIPT -->
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      let video = params.get("v");

      if (video) {
        if (!video.startsWith("http")) {
          video = "https://cdn.videy.co/" + video;
        }
      } else {
        video = "https://cdn.videy.co/k84OOz1w1.mp4";

      // Set sumber video
      player.src = video;

      player.addEventListener("contextmenu", e => e.preventDefault());
    })();
